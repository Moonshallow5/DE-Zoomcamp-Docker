  - id: create_plays_typed
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.plays`
      PARTITION BY game_date
      CLUSTER BY posteam, defteam, season
      AS
      SELECT
        SAFE_CAST(`play_id` AS INT64) AS `play_id`,
        SAFE_CAST(`game_id` AS INT64) AS `game_id`,
        `home_team`,
        `away_team`,
        `posteam`,
        `posteam_type`,
        `defteam`,
        `side_of_field`,
        SAFE_CAST(`yardline_100` AS INT64) AS `yardline_100`,
        SAFE.PARSE_DATE('%Y-%m-%d', `game_date`) AS `game_date`,
        SAFE_CAST(`quarter_seconds_remaining` AS INT64) AS `quarter_seconds_remaining`,
        SAFE_CAST(`half_seconds_remaining` AS INT64) AS `half_seconds_remaining`,
        SAFE_CAST(`game_seconds_remaining` AS INT64) AS `game_seconds_remaining`,
        `game_half`,
        SAFE_CAST(`quarter_end` AS INT64) AS `quarter_end`,
        SAFE_CAST(`drive` AS INT64) AS `drive`,
        SAFE_CAST(`sp` AS INT64) AS `sp`,
        SAFE_CAST(`qtr` AS INT64) AS `qtr`,
        SAFE_CAST(`down` AS INT64) AS `down`,
        SAFE_CAST(`goal_to_go` AS INT64) AS `goal_to_go`,
        `time`,
        `yrdln`,
        SAFE_CAST(`ydstogo` AS INT64) AS `ydstogo`,
        SAFE_CAST(`ydsnet` AS INT64) AS `ydsnet`,
        `desc`,
        `play_type`,
        SAFE_CAST(`yards_gained` AS INT64) AS `yards_gained`,
        SAFE_CAST(`shotgun` AS INT64) AS `shotgun`,
        SAFE_CAST(`no_huddle` AS INT64) AS `no_huddle`,
        SAFE_CAST(`qb_dropback` AS INT64) AS `qb_dropback`,
        SAFE_CAST(`qb_kneel` AS INT64) AS `qb_kneel`,
        SAFE_CAST(`qb_spike` AS INT64) AS `qb_spike`,
        SAFE_CAST(`qb_scramble` AS INT64) AS `qb_scramble`,
        `pass_length`,
        `pass_location`,
        SAFE_CAST(`air_yards` AS INT64) AS `air_yards`,
        SAFE_CAST(`yards_after_catch` AS INT64) AS `yards_after_catch`,
        `run_location`,
        `run_gap`,
        `field_goal_result`,
        SAFE_CAST(`kick_distance` AS INT64) AS `kick_distance`,
        `extra_point_result`,
        `two_point_conv_result`,
        SAFE_CAST(`home_timeouts_remaining` AS INT64) AS `home_timeouts_remaining`,
        SAFE_CAST(`away_timeouts_remaining` AS INT64) AS `away_timeouts_remaining`,
        SAFE_CAST(`timeout` AS INT64) AS `timeout`,
        `timeout_team`,
        `td_team`,
        SAFE_CAST(`posteam_timeouts_remaining` AS INT64) AS `posteam_timeouts_remaining`,
        SAFE_CAST(`defteam_timeouts_remaining` AS INT64) AS `defteam_timeouts_remaining`,
        SAFE_CAST(`total_home_score` AS INT64) AS `total_home_score`,
        SAFE_CAST(`total_away_score` AS INT64) AS `total_away_score`,
        SAFE_CAST(`posteam_score` AS INT64) AS `posteam_score`,
        SAFE_CAST(`defteam_score` AS INT64) AS `defteam_score`,
        SAFE_CAST(`score_differential` AS INT64) AS `score_differential`,
        SAFE_CAST(`posteam_score_post` AS INT64) AS `posteam_score_post`,
        SAFE_CAST(`defteam_score_post` AS INT64) AS `defteam_score_post`,
        SAFE_CAST(`score_differential_post` AS INT64) AS `score_differential_post`,
        SAFE_CAST(`no_score_prob` AS FLOAT64) AS `no_score_prob`,
        SAFE_CAST(`opp_fg_prob` AS FLOAT64) AS `opp_fg_prob`,
        SAFE_CAST(`opp_safety_prob` AS FLOAT64) AS `opp_safety_prob`,
        SAFE_CAST(`opp_td_prob` AS FLOAT64) AS `opp_td_prob`,
        SAFE_CAST(`fg_prob` AS FLOAT64) AS `fg_prob`,
        SAFE_CAST(`safety_prob` AS FLOAT64) AS `safety_prob`,
        SAFE_CAST(`td_prob` AS FLOAT64) AS `td_prob`,
        SAFE_CAST(`extra_point_prob` AS FLOAT64) AS `extra_point_prob`,
        SAFE_CAST(`two_point_conversion_prob` AS FLOAT64) AS `two_point_conversion_prob`,
        SAFE_CAST(`ep` AS FLOAT64) AS `ep`,
        SAFE_CAST(`epa` AS FLOAT64) AS `epa`,
        SAFE_CAST(`total_home_epa` AS FLOAT64) AS `total_home_epa`,
        SAFE_CAST(`total_away_epa` AS FLOAT64) AS `total_away_epa`,
        SAFE_CAST(`total_home_rush_epa` AS FLOAT64) AS `total_home_rush_epa`,
        SAFE_CAST(`total_away_rush_epa` AS FLOAT64) AS `total_away_rush_epa`,
        SAFE_CAST(`total_home_pass_epa` AS FLOAT64) AS `total_home_pass_epa`,
        SAFE_CAST(`total_away_pass_epa` AS FLOAT64) AS `total_away_pass_epa`,
        SAFE_CAST(`air_epa` AS FLOAT64) AS `air_epa`,
        SAFE_CAST(`yac_epa` AS FLOAT64) AS `yac_epa`,
        SAFE_CAST(`comp_air_epa` AS FLOAT64) AS `comp_air_epa`,
        SAFE_CAST(`comp_yac_epa` AS FLOAT64) AS `comp_yac_epa`,
        SAFE_CAST(`total_home_comp_air_epa` AS FLOAT64) AS `total_home_comp_air_epa`,
        SAFE_CAST(`total_away_comp_air_epa` AS FLOAT64) AS `total_away_comp_air_epa`,
        SAFE_CAST(`total_home_comp_yac_epa` AS FLOAT64) AS `total_home_comp_yac_epa`,
        SAFE_CAST(`total_away_comp_yac_epa` AS FLOAT64) AS `total_away_comp_yac_epa`,
        SAFE_CAST(`total_home_raw_air_epa` AS FLOAT64) AS `total_home_raw_air_epa`,
